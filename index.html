
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="google-site-verification" content="8SgycuRmRXb11zMJUYYI8-drpDS2AOdvH2MW-gPU8Jc" />
    
    <!-- Título estático de fallback pra quem carregar sem JS — cada rota
    sobrescreve via react-helmet-async (AdvancedSEO / Helmet por página). A
    meta description fica só a cargo do Helmet: como ele nunca remove uma
    tag que não foi ele quem criou, uma <meta description> estática aqui
    ficaria duplicada ao lado da de cada página. -->
    <title>Site para Corretor de Imóveis | Pronto na Hora - HabiFy</title>
    <meta name="author" content="HabiFy" />
    <meta name="theme-color" content="#FE5C02" />
    
    <!-- og:image fica só a cargo do Helmet (AdvancedSEO), que usa URL
    absoluta — a tag estática que existia aqui usava caminho relativo
    (/fotos/...), que o Facebook/WhatsApp rejeita como "URL inválido" e
    nunca era removida pelo Helmet, então convivia com a absoluta certa. -->
    <meta property="og:type" content="website" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logotipo_habify.png" />
    
    <!-- Preload Critical Assets -->
    <link rel="preload" href="/Header-background.webp" as="image" type="image/webp" fetchpriority="high" />
    
    <!-- Google Fonts (non-blocking with display=swap) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" /></noscript>
    
    <!-- Preconnect to external domains (limited to critical) -->
    <link rel="preconnect" href="https://cdn.gpteng.co" crossorigin />
    <link rel="dns-prefetch" href="https://wa.me" />
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
